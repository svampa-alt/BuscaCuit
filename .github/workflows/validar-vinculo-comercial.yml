name: Validar vinculo comercial
on:
  push:
    paths:
      - 'scripts/vinculo_comercial.py'
      - 'tests/test_vinculo_comercial.py'
      - '.github/workflows/validar-vinculo-comercial.yml'
  pull_request:
    paths:
      - 'scripts/vinculo_comercial.py'
      - 'tests/test_vinculo_comercial.py'
      - '.github/workflows/validar-vinculo-comercial.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
