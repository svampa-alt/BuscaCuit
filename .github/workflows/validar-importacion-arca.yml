name: Validar importacion mensual ARCA
on:
  pull_request:
    paths:
      - 'scripts/descargar_padron.py'
      - 'tests/test_importacion_mensual.py'
      - '.github/workflows/validar-importacion-arca.yml'
  push:
    paths:
      - 'scripts/descargar_padron.py'
      - 'tests/test_importacion_mensual.py'
      - '.github/workflows/validar-importacion-arca.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar importacion manual y pruebas existentes
        run: python -m unittest discover -s tests -v
