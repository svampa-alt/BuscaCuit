name: Descargar y validar padrón ARCA
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1'
jobs:
  padron:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar y construir índice
        run: python scripts/descargar_padron.py
      - name: Guardar base consultable y metadatos
        uses: actions/upload-artifact@v4
        with:
          name: buscacuit-padron
          path: output/
          retention-days: 30
          if-no-files-found: error
