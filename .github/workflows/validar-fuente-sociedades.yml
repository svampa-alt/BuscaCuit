name: Validar fuente Registro Nacional de Sociedades
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fuente_sociedades.py'
      - 'tests/test_fuente_sociedades.py'
      - '.github/workflows/validar-fuente-sociedades.yml'
  push:
    paths:
      - 'scripts/fuente_sociedades.py'
      - 'tests/test_fuente_sociedades.py'
      - '.github/workflows/validar-fuente-sociedades.yml'
permissions:
  contents: read
concurrency:
  group: sociedades-fuente-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Descarga real de muestra (no bloquea registro completo)
        continue-on-error: true
        run: python scripts/fuente_sociedades.py --output output/fuentes
      - name: Descarga y validacion del registro completo
        run: python scripts/fuente_sociedades.py --full --output output/fuentes
      - name: Guardar exclusivamente metadatos
        uses: actions/upload-artifact@v4
        with:
          name: fuente-sociedades-metadatos
          path: output/fuentes/*_metadata.json
          retention-days: 30
          if-no-files-found: error
